; QA replaces the ops/tests exclusions with explicit exclusions of every other ops resource.
; Inclusion filters cannot override exclusion filters. Both presets omit generated builds.
[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="intro_video.ogv,music/*.mp3,assets/models/*.glb,scenes/*,scripts/*,bin/*.dll,icon.svg,Skate_Grind.res,sprites/*"
exclude_filter="ops/*,tests/*,godot-cpp/*,src/*,.worktrees/*,build/*,bin/~*,bin/*.pdb,bin/*.lib,bin/*.exp,bin/*.ilk,bin/*.tmp,*.md,*.log,Prompt___Generate_a_aspect.mp4,test_proc_mat.tres,test_quad.tres,digital-delivery.md,SConstruct,.sconsign.dblite,.gitmodules,export_presets.cfg"
export_path="build/release/Y2K-BioPunk.exe"
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=2
binary_format/embed_pck=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/icon="res://icon.svg"
application/file_version="1.1.0.0"
application/product_version="1.1 (VS1.1)"
application/company_name="Anthony Dilisio"
application/product_name="Y2K: Bio-Punk"

[preset.1]
