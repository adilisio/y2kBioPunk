exclude_filter="ops/briefs/*,ops/reports/*,ops/runs/*,ops/secrets/*,ops/tools/meshy/*,ops/tools/*.ps1,ops/tools/*.py,ops/tools/*.json,ops/tools/balance_table.gd,ops/tools/build_greybox.gd,ops/tools/check_enemy_models.gd,ops/tools/inspect_glb.gd,ops/tools/shot_feel_visual.gd,ops/tools/sim_steer.gd,ops/tools/smoke_mall.gd,godot-cpp/*,src/*,.worktrees/*,build/*,bin/~*,bin/*.pdb,bin/*.lib,bin/*.exp,bin/*.ilk,bin/*.tmp,*.md,*.log,Prompt___Generate_a_aspect.mp4,test_proc_mat.tres,test_quad.tres,digital-delivery.md,SConstruct,.sconsign.dblite,.gitmodules,export_presets.cfg"
